<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Include this line for instant inline Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      const messages = [
        {
          type: 'MWA_BYOD_ESIM_INSTALL',
          payload: {
            scheme: 'LPA:test-install-url',
          },
        },
        {
          type: 'MWA_BYOD_REDIRECT_ON_DONE',
          payload: {
            route: 'overview',
          },
        },
        {
          type: 'MWA_BYOD_REDIRECT_PREPAID_PLANS',
          payload: {
            url: 'https://www.telus.com/sample-route',
          },
        },
      ];
      const sendDataToReactNative = dataNumber => {
        const data = messages[dataNumber] ?? {};
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify(data));
        } else {
          console.warn(
            'window.ReactNativeWebView not found. Are you in a WebView?',
          );
        }
      };

      const attachButtonHandlers = () => {
        const buttons = document.querySelectorAll('[data-message-index]');
        buttons.forEach(button => {
          button.addEventListener('click', () => {
            const messageIndex = Number(button.dataset.messageIndex);
            sendDataToReactNative(messageIndex);
          });
        });
      };

      document.addEventListener('DOMContentLoaded', attachButtonHandlers);
    </script>
  </head>
  <body>
    <div
      class="min-h-screen bg-gradient-to-br from-blue-50 to-slate-100 flex items-center justify-center p-6">
      <div class="bg-white rounded-2xl shadow-lg p-8 max-w-md w-full">
        <div class="flex items-center gap-3 mb-6">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            class="w-8 h-8 text-blue-600">
            <path d="M22 2 11 13" />
            <path d="m22 2-7 20-4-9-9-4Z" />
          </svg>
          <h1 class="text-2xl font-bold text-gray-800">WebView Messenger</h1>
        </div>

        <p class="text-gray-600 mb-8">
          Click any button to send a message to React Native
        </p>

        <div class="space-y-4 gap-3">
          <button
            data-message-index="0"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-md hover:shadow-lg text-left">
            <span class="block text-base leading-tight">Install eSIM</span>
            <span class="block mt-1 text-xs font-mono font-normal opacity-90 break-all leading-tight">MWA_BYOD_ESIM_INSTALL</span>
          </button>
          <button
            data-message-index="1"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-md hover:shadow-lg text-left">
            <span class="block text-base leading-tight">Go to Overview</span>
            <span class="block mt-1 text-xs font-mono font-normal opacity-90 break-all leading-tight">MWA_BYOD_REDIRECT_ON_DONE</span>
          </button>
          <button
            data-message-index="2"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-md hover:shadow-lg text-left">
            <span class="block text-base leading-tight">View Prepaid Plans</span>
            <span class="block mt-1 text-xs font-mono font-normal opacity-90 break-all leading-tight">MWA_BYOD_REDIRECT_PREPAID_PLANS</span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
